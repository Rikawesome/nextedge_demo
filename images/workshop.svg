<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradWork" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2430"/>
      <stop offset="50%" stop-color="#2C3B4E"/>
      <stop offset="100%" stop-color="#0E1620"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,25,35,0.1)"/>
      <stop offset="100%" stop-color="rgba(15,25,35,0.85)"/>
