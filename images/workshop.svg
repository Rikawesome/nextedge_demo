    <path d="M 20 40 L 40 25 L 60 35 L 80 15" stroke="#E05A2B" stroke-width="4"/>
  </g>

  <text x="400" y="360" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SKILLS & WORKSHOPS</text>

  <rect width="800" height="600" fill="url(#overlayGrad)"/>
