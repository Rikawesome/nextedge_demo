<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMentor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142B42"/>
      <stop offset="60%" stop-color="#1F476E"/>
      <stop offset="100%" stop-color="#091827"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(10,30,50,0.1)"/>
      <stop offset="100%" stop-color="rgba(10,30,50,0.85)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGradMentor)"/>

  <!-- Mentorship icon -->
  <g transform="translate(350, 190)" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Mentor -->
    <circle cx="30" cy="25" r="16"/>
    <path d="M 0 80 A 30 30 0 0 1 60 80"/>
    <!-- Mentee -->
    <circle cx="80" cy="35" r="12" stroke="#E05A2B"/>
    <path d="M 55 80 A 25 25 0 0 1 105 80" stroke="#E05A2B"/>
  </g>

  <circle cx="400" cy="240" r="110" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <text x="400" y="360" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">1-ON-1 MENTORSHIP</text>

  <rect width="800" height="600" fill="url(#overlayGrad)"/>
</svg>
