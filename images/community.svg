<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradComm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112E23"/>
      <stop offset="60%" stop-color="#1F5240"/>
      <stop offset="100%" stop-color="#0A1C15"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(10,35,25,0.1)"/>
      <stop offset="100%" stop-color="rgba(10,35,25,0.85)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGradComm)"/>

  <!-- Agriculture Leaf Icon -->
  <g transform="translate(360, 180)" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 0 C 80 0, 80 50, 80 80 C 50 80, 0 80, 0 40 C 0 0, 40 0, 40 0 Z" fill="rgba(224,90,43,0.2)" stroke="#E05A2B"/>
    <line x1="40" y1="80" x2="40" y2="20"/>
    <path d="M40 50 Q 60 40 70 30"/>
    <path d="M40 60 Q 20 50 10 40"/>
  </g>

  <circle cx="400" cy="240" r="110" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <text x="400" y="360" font-family="'Outfit', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AGRICULTURAL OUTREACH</text>

  <rect width="800" height="600" fill="url(#overlayGrad)"/>
</svg>
